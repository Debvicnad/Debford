name: Debford CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://debford.com"
          NEXT_PUBLIC_APP_NAME: "Debford"
